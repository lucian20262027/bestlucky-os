<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bl-royal-gold" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="52%" stop-color="#6E32F5" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bl-gold-rim" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#DDD6FE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="bl-star-gold" x1="42" y1="9" x2="54" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bl-royal-gold)" />
  <!-- Subtle Metallic Gold Rim -->
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="url(#bl-gold-rim)" stroke-width="1.6" />

  <!-- Top-Right Lucky North Star -->
  <path
    d="M48 9.5C48.7 13.7 51.3 16.3 55.5 17C51.3 17.7 48.7 20.3 48 24.5C47.3 20.3 44.7 17.7 40.5 17C44.7 16.3 47.3 13.7 48 9.5Z"
    fill="url(#bl-star-gold)"
  />

  <!-- Crisp "Best" Wordmark -->
  <text
    x="31"
    y="42.5"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
    font-size="21"
    font-weight="800"
    letter-spacing="-0.8"
  >
    Best
  </text>

  <!-- Subtle Gold Horizon Accent Under "Best" -->
  <rect x="14" y="48" width="36" height="2.4" rx="1.2" fill="url(#bl-star-gold)" opacity="0.92" />
</svg>
